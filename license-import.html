
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校端管理平台 — 初始化安装</title>
<style>
  :root {
    --bg:          #ffffff;
    --bg-page:     #f5f5f5;
    --surface:     #ffffff;
    --fg:          #0d0d0d;
    --muted:       #555555;
    --muted-light: #767676;
    --border:      rgba(0,0,0,0.05);
    --border-md:   rgba(0,0,0,0.08);
    --accent:      #18E299;
    --accent-deep: #0fa76e;
    --accent-light:#d4fae8;
    --error:       #d45656;
    --error-light: #fde8e8;
    --info:        #3772cf;
    --info-light:  #e8f0fe;
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-mono:    'Geist Mono', 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-xl: 24px; --radius-pill: 9999px;
    --shadow-card: rgba(0,0,0,0.03) 0 2px 4px; --shadow-btn: rgba(0,0,0,0.06) 0 1px 2px;
    --shadow-focused: rgba(24,226,153,0.18) 0 0 0 3px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:var(--font-body);color:var(--fg);background:var(--bg-page);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.5}
  .install-page{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center}
  .step-indicator{display:flex;align-items:center;margin-bottom:32px;width:100%}
  .step-item{display:flex;align-items:center;flex:0 0 auto}
  .step-dot{width:28px;height:28px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;transition:background .3s,color .3s,transform .3s}
  .step-dot[aria-current="step"]{background:var(--fg);color:#fff;transform:scale(1.08)}
  .step-dot.pending{background:rgba(0,0,0,.06);color:var(--muted-light)}
  .step-dot.done{background:var(--accent);color:var(--fg)}
  .step-label{margin-left:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .3s}
  .step-item[aria-current="step"] .step-label{color:var(--fg);font-weight:600}
  .step-line{flex:1 1 0%;height:2px;background:rgba(0,0,0,.06);margin:0 10px;min-width:16px;border-radius:1px;transition:background .4s}
  .step-line.done{background:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:48px 40px 40px;width:100%;box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;animation:cardIn .45s cubic-bezier(.22,1,.36,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .license-icon{width:64px;height:64px;border-radius:var(--radius-lg);background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin-bottom:24px;transition:background .3s}
  .license-icon svg{width:32px;height:32px;color:var(--accent-deep);transition:color .3s}
  .license-icon.success{background:var(--accent-light)}.license-icon.success svg{color:var(--accent-deep)}
  .license-icon.error{background:var(--error-light)}.license-icon.error svg{color:var(--error)}
  .license-icon.hidden{display:none}
  .card-title{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.24px;line-height:1.3;text-align:center;color:var(--fg);margin-bottom:8px}
  .card-title.hidden{display:none}
  .card-subtitle{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px;line-height:1.6}
  .card-subtitle.emphasis{font-size:18px;font-weight:600;color:var(--fg)}
  .card-subtitle.hidden{display:none;margin-bottom:0}
  .step-content{width:100%}
  .upload-zone{width:100%;border:2px dashed rgba(0,0,0,.1);border-radius:var(--radius-lg);padding:36px 24px;text-align:center;cursor:pointer;transition:border-color .25s,background .25s,box-shadow .25s,opacity .3s,padding .35s cubic-bezier(.22,1,.36,1);background:var(--bg);position:relative}
  .upload-zone.locked{pointer-events:none;opacity:.55}
  .upload-zone:hover{border-color:var(--accent);background:rgba(24,226,153,.02)}
  .upload-zone:focus-within{border-color:var(--accent);box-shadow:var(--shadow-focused)}
  .upload-zone.dragover{border-color:var(--accent);background:var(--accent-light);animation:pulseBorder 1.2s ease infinite}
  @keyframes pulseBorder{0%,100%{border-color:var(--accent)}50%{border-color:rgba(24,226,153,.35)}}
  .upload-zone.has-file{border-style:solid;border-color:var(--accent);background:rgba(24,226,153,.03);padding:14px 20px}
  .upload-zone.has-error{border-color:var(--error);background:rgba(212,86,86,.02)}
  .upload-icon{margin-bottom:12px}.upload-icon svg{width:32px;height:32px;color:var(--muted-light);transition:color .25s,transform .25s}
  .upload-zone:hover .upload-icon svg{color:var(--accent-deep);transform:translateY(-2px)}
  .upload-zone.dragover .upload-icon svg{color:var(--accent-deep);transform:translateY(-4px)}
  .upload-text{font-size:14px;color:var(--muted);line-height:1.6}
  .upload-text .browse-link{color:var(--accent-deep);font-weight:500;text-decoration:underline;text-underline-offset:2px;cursor:pointer;border-radius:2px;transition:color .15s}
  .upload-text .browse-link:hover{color:var(--fg)}
  .upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-zone input[type="file"]:focus-visible{outline:none}
  .file-info{display:flex;align-items:center;justify-content:center;gap:10px}
  .file-info svg{width:20px;height:20px;color:var(--accent-deep);flex-shrink:0}
  .file-info .file-name{font-size:14px;font-weight:500;color:var(--fg);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .file-remove{background:none;border:none;cursor:pointer;color:var(--muted-light);font-size:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;line-height:1;border-radius:var(--radius-md);transition:color .15s,background .15s;flex-shrink:0}
  .file-remove:hover{color:var(--error);background:var(--error-light)}
  .file-remove:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .verify-progress{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.22,1,.36,1),opacity .3s,margin-top .3s;margin-top:0}
  .verify-progress.visible{max-height:300px;opacity:1;margin-top:24px}
  .verify-progress-inner{background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px}
  .verify-progress-title{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:16px;letter-spacing:.01em}
  .verify-step{display:flex;align-items:center;gap:12px;padding:10px 0}
  .verify-step+.verify-step{border-top:1px solid var(--border)}
  .verify-step-dot{width:24px;height:24px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s,color .3s,border-color .3s;position:relative}
  .verify-step-dot svg{width:12px;height:12px}
  .verify-step[data-state="pending"] .verify-step-dot{background:transparent;border:2px solid rgba(0,0,0,.1);color:transparent}
  .verify-step[data-state="running"] .verify-step-dot{background:var(--accent-light);border:2px solid var(--accent-deep);color:var(--accent-deep)}
  .verify-step[data-state="running"] .verify-step-dot svg{display:none}
  .verify-step[data-state="running"] .verify-step-dot::after{content:'';width:12px;height:12px;border:2px solid rgba(24,226,153,.2);border-top-color:var(--accent-deep);border-radius:50%;animation:spin .7s linear infinite}
  .verify-step[data-state="done"] .verify-step-dot{background:var(--accent);border:2px solid var(--accent);color:var(--fg)}
  .verify-step[data-state="error"] .verify-step-dot{background:var(--error);border:2px solid var(--error);color:#fff}
  .verify-step-name{font-size:14px;font-weight:500;color:var(--muted);flex:1;transition:color .3s}
  .verify-step[data-state="running"] .verify-step-name,.verify-step[data-state="done"] .verify-step-name{color:var(--fg)}
  .verify-step[data-state="error"] .verify-step-name{color:var(--error)}
  .verify-step-status{font-size:12px;font-weight:500;color:var(--muted-light);flex-shrink:0;transition:color .3s;min-width:56px;text-align:right}
  .verify-step[data-state="running"] .verify-step-status{color:var(--accent-deep)}
  .verify-step[data-state="done"] .verify-step-status{color:var(--accent-deep)}
  .verify-step[data-state="error"] .verify-step-status{color:var(--error)}
  .status-msg{width:100%;padding:10px 14px;border-radius:var(--radius-md);font-size:13px;line-height:1.5;display:flex;align-items:flex-start;gap:8px;margin-bottom:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s,opacity .25s,margin-bottom .3s,padding .3s;padding-top:0;padding-bottom:0}
  .status-msg.visible{max-height:80px;opacity:1;margin-bottom:20px;padding:10px 14px}
  .status-msg svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
  .status-msg.success{background:var(--accent-light);color:var(--accent-deep)}
  .status-msg.error{background:var(--error-light);color:var(--error)}
  .btn-row{width:100%;margin-top:32px;display:flex;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:15px;font-weight:500;line-height:1.5;border-radius:var(--radius-pill);cursor:pointer;transition:background .2s,opacity .2s,transform .1s,box-shadow .2s;outline:none;border:none;padding:12px 28px;position:relative}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn svg{width:16px;height:16px;flex-shrink:0}
  .btn-primary{background:var(--fg);color:#fff;box-shadow:var(--shadow-btn);flex:1}
  .btn-primary:hover:not(:disabled){background:#1a1a1a}
  .btn-primary:active:not(:disabled){transform:scale(.985);box-shadow:none}
  .btn-primary:disabled{background:rgba(0,0,0,.08);color:var(--muted-light);cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:var(--bg);color:var(--fg);border:1.5px solid var(--border-md);flex-shrink:0;min-width:100px}
  .btn-ghost:hover{background:var(--bg-page)}
  .btn-ghost:active{transform:scale(.985)}
  .btn-retry{background:var(--fg);color:#fff;box-shadow:var(--shadow-btn);flex:1}
  .btn-retry:hover{background:#1a1a1a}.btn-retry:active{transform:scale(.985);box-shadow:none}
  .btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
  .btn:disabled .spinner{border-color:rgba(0,0,0,.1);border-top-color:var(--muted-light)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-row.single{display:block}
  .btn-row.single .btn{width:100%}
  .form-field{width:100%;margin-bottom:20px}
  .form-field:last-child{margin-bottom:0}
  .form-field label{display:block;font-size:13px;font-weight:500;color:var(--fg);margin-bottom:6px;letter-spacing:.01em}
  .form-field label .required{color:var(--error);margin-left:2px}
  .form-input{width:100%;height:44px;padding:0 14px;font-family:var(--font-body);font-size:14px;color:var(--fg);background:var(--bg);border:1.5px solid var(--border-md);border-radius:var(--radius-md);outline:none;transition:border-color .2s,box-shadow .2s}
  .form-input::placeholder{color:var(--muted-light)}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,226,153,.12)}
  .form-input.readonly{background:var(--bg-page);color:var(--muted);cursor:default;border-color:var(--border)}
  .form-input.readonly:focus{border-color:var(--border);box-shadow:none}
  .form-input.error{border-color:var(--error);box-shadow:0 0 0 3px rgba(212,86,86,.1)}
  .form-error{font-size:12px;color:var(--error);margin-top:4px;display:none;line-height:1.4}
  .form-error.visible{display:block}
  .input-with-action{display:flex;position:relative}
  .input-with-action .form-input{padding-right:44px;flex:1}
  .input-copy-btn{position:absolute;right:1px;top:1px;bottom:1px;width:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--muted-light);border-radius:0 var(--radius-md) var(--radius-md) 0;transition:color .15s,background .15s}
  .input-copy-btn:hover{color:var(--accent-deep);background:var(--accent-light)}
  .input-copy-btn:active{background:rgba(24,226,153,.15)}
  .input-copy-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .input-copy-btn svg{width:16px;height:16px}
  .input-copy-btn.copied{color:var(--accent-deep)}
  .copy-toast{position:absolute;bottom:calc(100% + 8px);right:-12px;background:var(--fg);color:#fff;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--radius-sm);white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
  .copy-toast::after{content:'';position:absolute;top:100%;right:18px;border:5px solid transparent;border-top-color:var(--fg)}
  .copy-toast.visible{opacity:1;transform:translateY(0)}
  .phone-group{display:flex}
  .phone-prefix{height:44px;padding:0 12px;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--fg);background:var(--bg-page);border:1.5px solid var(--border-md);border-right:none;border-radius:var(--radius-md) 0 0 var(--radius-md);white-space:nowrap}
  .phone-group .form-input{border-radius:0 var(--radius-md) var(--radius-md) 0}
  .sms-group{display:flex;gap:10px}
  .sms-group .form-input{flex:1}
  .sms-btn{height:44px;padding:0 16px;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--accent-deep);background:var(--accent-light);border:1.5px solid rgba(24,226,153,.3);border-radius:var(--radius-md);cursor:pointer;white-space:nowrap;transition:opacity .2s,background .2s;flex-shrink:0}
  .sms-btn:hover:not(:disabled){background:rgba(24,226,153,.25)}
  .sms-btn:disabled{opacity:.6;cursor:not-allowed}
  .sms-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .date-range{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--bg-page);border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;color:var(--muted)}
  .date-range .date-sep{font-size:13px;color:var(--muted-light);font-weight:500}
  .date-range .date-val{font-family:var(--font-mono);font-size:13px;letter-spacing:.01em}
  .sync-area{width:100%;padding:4px 0}
  .sync-task{padding:20px 0}
  .sync-task:first-child{padding-top:0}
  .sync-task:last-child{border-bottom:none;padding-bottom:0}
  .sync-task-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .sync-task-icon{width:24px;height:24px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s,color .3s,border-color .3s;border:2px solid transparent}
  .sync-task-icon svg{width:12px;height:12px}
  .sync-task-icon.pending{background:transparent;border-color:rgba(0,0,0,.1);color:transparent}
  .sync-task-icon.running{background:var(--accent-light);border-color:var(--accent-deep);color:var(--accent-deep)}
  .sync-task-icon.running svg{display:none}
  .sync-task-icon.running::after{content:'';width:12px;height:12px;border:2px solid rgba(24,226,153,.2);border-top-color:var(--accent-deep);border-radius:50%;animation:spin .7s linear infinite}
  .sync-task-icon.done{background:var(--accent);border-color:var(--accent);color:var(--fg)}
  .sync-task-icon.error{background:var(--error);border-color:var(--error);color:#fff}
  .sync-task-name{font-size:14px;font-weight:500;color:var(--muted);flex:1;transition:color .3s}
  .sync-task.running .sync-task-name,.sync-task.done .sync-task-name{color:var(--fg)}
  .sync-task.error .sync-task-name{color:var(--error)}
  .sync-task-percent{font-size:12px;font-weight:600;font-family:var(--font-mono);min-width:36px;text-align:right;transition:color .3s}
  .sync-task.pending .sync-task-percent{color:var(--muted-light)}
  .sync-task.running .sync-task-percent{color:var(--accent-deep)}
  .sync-task.done .sync-task-percent{color:var(--accent-deep)}
  .sync-task.error .sync-task-percent{color:var(--error)}
  .sync-progress-track{width:100%;height:6px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden}
  .sync-progress-fill{height:100%;border-radius:3px;transition:width .3s ease,background .3s;width:0%}
  .sync-progress-fill.running{background:var(--accent)}
  .sync-progress-fill.done{background:var(--accent)}
  .sync-progress-fill.error{background:var(--error)}
  .sync-task-file{font-size:12px;color:var(--muted-light);margin-top:6px;font-family:var(--font-mono);min-height:18px;transition:color .3s}
  .sync-task.error .sync-task-file{color:var(--error)}
  .sync-error-msg{width:100%;margin-top:20px;padding:10px 14px;border-radius:var(--radius-md);background:var(--error-light);color:var(--error);font-size:13px;display:none;align-items:center;gap:8px;line-height:1.5}
  .sync-error-msg.visible{display:flex}
  .sync-error-msg svg{width:16px;height:16px;flex-shrink:0}
  .sync-retry-row{width:100%;margin-top:20px}
  .sync-retry-row .btn{width:100%}
  .success-area{width:100%;text-align:center;padding:12px 0 4px}
  .success-badge{width:72px;height:72px;border-radius:var(--radius-pill);background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .success-badge svg{width:36px;height:36px;color:var(--accent-deep)}
  .success-desc{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6}
  .card-footer{margin-top:24px;font-size:12px;color:var(--muted-light);text-align:center;line-height:1.5}
  .card-footer a{color:var(--accent-deep);text-decoration:underline;text-underline-offset:2px;border-radius:2px;transition:color .15s}
  .card-footer a:hover{color:var(--fg)}
  .card-footer a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(5px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
  @media(max-width:600px){
    body{padding:16px;align-items:flex-start;padding-top:24px}
    .card{padding:32px 20px 28px;border-radius:var(--radius-lg)}
    .card-title{font-size:20px;letter-spacing:-.2px}
    .step-label{display:none}.step-line{margin:0 6px}
    .upload-zone{padding:28px 16px}.upload-zone.has-file{padding:12px 14px}
    .upload-icon svg{width:28px;height:28px}
    .file-info{flex-wrap:wrap;gap:4px 8px}.file-info .file-name{max-width:180px}
    .verify-progress-inner{padding:16px}
    .verify-step{gap:8px}.verify-step-name{font-size:13px}.verify-step-status{font-size:11px;min-width:48px}
    .btn{padding:12px 20px}.btn-ghost{min-width:80px;font-size:14px}
    .form-input{height:42px;font-size:13px}
    .input-with-action .form-input{padding-right:40px}.input-copy-btn{width:38px}
    .phone-prefix{height:42px;font-size:13px}
    .sms-btn{height:42px;font-size:12px;padding:0 12px}
    .date-range{height:42px;font-size:13px}
  }
  @media(min-width:601px) and (max-width:820px){.card{padding:40px 32px 36px}}
  @media(prefers-reduced-motion:reduce){
    .card{animation:none}.upload-zone.dragover{animation:none}
    .step-dot,.step-label,.step-line,.upload-zone,.upload-icon svg,.status-msg,.btn,.verify-progress,.verify-step-dot,.verify-step-name,.verify-step-status,.sync-task-icon,.sync-task-name,.sync-task-percent,.sync-progress-fill,.sync-task-file,.copy-toast{transition:none}
    .btn .spinner{animation:spin 1.2s linear infinite}
    .verify-step[data-state="running"] .verify-step-dot::after,.sync-task-icon.running::after{animation:spin 1.4s linear infinite}
  }
</style>
</head>
<body>
<div class="install-page">
  <nav class="step-indicator" aria-label="安装步骤">
    <div class="step-item" aria-current="step" id="step1"><div class="step-dot" aria-current="step">1</div><span class="step-label">导入 License</span></div>
    <div class="step-line" id="line1"></div>
    <div class="step-item" id="step2"><div class="step-dot pending">2</div><span class="step-label">完善基础信息</span></div>
    <div class="step-line" id="line2"></div>
    <div class="step-item" id="step3"><div class="step-dot pending">3</div><span class="step-label">数据同步</span></div>
    <div class="step-line" id="line3"></div>

<script>
(function(){
  'use strict';
  var card=document.getElementById('mainCard'),licenseIcon=document.getElementById('licenseIcon'),iconSvg=document.getElementById('iconSvg'),cardTitle=document.getElementById('cardTitle'),cardSubtitle=document.getElementById('cardSubtitle');
  var step1=document.getElementById('step1Content'),step2=document.getElementById('step2Content'),step3=document.getElementById('step3Content'),step4=document.getElementById('step4Content');
  var uploadZone=document.getElementById('uploadZone'),fileInput=document.getElementById('fileInput'),uploadContent=document.getElementById('uploadContent'),fileInfoEl=document.getElementById('fileInfo'),fileNameEl=document.getElementById('fileName'),fileRemove=document.getElementById('fileRemove');
  var btnNext=document.getElementById('btnNext'),btnLabel=document.getElementById('btnLabel'),btnArrow=document.getElementById('btnArrow');
  var statusMsg=document.getElementById('statusMsg'),statusText=document.getElementById('statusText'),statusIcon=document.getElementById('statusIcon');
  var verifyProgress=document.getElementById('verifyProgress');
  var currentFile=null,fileContent='',isVerifying=false;
  function getStep(n){return document.getElementById('step'+n)}
  function getLine(n){return document.getElementById('line'+n)}
  function getVStep(n){return document.getElementById('vStep'+n)}
  function updateNextState(){btnNext.disabled=!currentFile||isVerifying}
  function advanceStepIndicator(n){var ds=getStep(n),ns=getStep(n+1),dl=getLine(n);if(ds){ds.removeAttribute('aria-current');var d=ds.querySelector('.step-dot');d.removeAttribute('aria-current');d.className='step-dot done';d.innerHTML='&#10003;'}if(dl)dl.classList.add('done');if(ns){ns.setAttribute('aria-current','step');var nd=ns.querySelector('.step-dot');nd.className='step-dot';nd.setAttribute('aria-current','step')}}
  function regressStepIndicator(n){for(var i=4;i>=1;i--){var si=getStep(i),dot=si.querySelector('.step-dot'),li=getLine(i-1);if(i>n){si.removeAttribute('aria-current');dot.className='step-dot pending';dot.removeAttribute('aria-current');dot.textContent=i;if(li)li.classList.remove('done')}}var ts=getStep(n);ts.setAttribute('aria-current','step');var td=ts.querySelector('.step-dot');td.className='step-dot';td.setAttribute('aria-current','step')}
  function showStep(n){step1.style.display='none';step2.style.display='none';step3.style.display='none';step4.style.display='none';[null,step1,step2,step3,step4][n].style.display='';card.style.animation='none';card.offsetHeight;card.style.animation='cardIn 0.4s cubic-bezier(.22,1,.36,1)'}
  var ICONS={key:'<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5l3 3"/>',user:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',sync:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>',check:'<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'};
  function setIcon(t){iconSvg.innerHTML=ICONS[t]||ICONS.key;licenseIcon.className='license-icon';licenseIcon.classList.remove('hidden')}
  function goToStep1(){regressStepIndicator(1);setIcon('key');cardTitle.textContent='初始化安装';cardTitle.classList.remove('hidden');cardSubtitle.textContent='请上传 License 授权文件';cardSubtitle.className='card-subtitle emphasis';cardSubtitle.classList.remove('hidden');showStep(1);clearStatus();hideVerifyProgress();resetVerifyProgress();setButtonDefault();updateNextState()}
  function goToStep2(){advanceStepIndicator(1);setIcon('user');cardTitle.textContent='完善基础信息';cardTitle.classList.remove('hidden');cardSubtitle.textContent='请填写管理员和学校的基础信息';cardSubtitle.className='card-subtitle';cardSubtitle.classList.remove('hidden');showStep(2)}
  function goToStep3(){advanceStepIndicator(2);setIcon('sync');cardTitle.textContent='同步数据';cardTitle.classList.remove('hidden');cardSubtitle.textContent='正在同步模型文件与规则配置…';cardSubtitle.className='card-subtitle';cardSubtitle.classList.remove('hidden');showStep(3);startSync()}
  function goToStep4(){advanceStepIndicator(3);licenseIcon.classList.add('hidden');cardTitle.classList.add('hidden');cardSubtitle.classList.add('hidden');showStep(4)}
  uploadZone.addEventListener('dragover',function(e){e.preventDefault();if(!uploadZone.classList.contains('has-file'))uploadZone.classList.add('dragover')});
  uploadZone.addEventListener('dragleave',function(e){if(!uploadZone.contains(e.relatedTarget))uploadZone.classList.remove('dragover')});
  uploadZone.addEventListener('drop',function(e){e.preventDefault();uploadZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
  fileInput.addEventListener('change',function(){if(fileInput.files.length)handleFile(fileInput.files[0])});
  function handleFile(f){if(isVerifying)return;var ext='.'+f.name.split('.').pop().toLowerCase();if(!['.lic','.key','.txt'].includes(ext)){showStatus('error','不支持的文件格式');uploadZone.classList.add('has-error');return}if(f.size>1048576){showStatus('error','文件大小超过 1 MB');uploadZone.classList.add('has-error');return}currentFile=f;fileNameEl.textContent=f.name;uploadContent.style.display='none';fileInfoEl.style.display='block';uploadZone.classList.remove('has-error');uploadZone.classList.add('has-file');clearStatus();resetVerifyProgress();var r=new FileReader();r.onload=function(e){fileContent=e.target.result;updateNextState()};r.readAsText(f)}
  fileRemove.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();removeFile()});
  fileRemove.addEventListener('mousedown',function(e){e.stopPropagation()});
  function removeFile(){if(isVerifying)return;currentFile=null;fileContent='';fileInput.value='';uploadContent.style.display='';fileInfoEl.style.display='none';uploadZone.classList.remove('has-file','has-error','locked');clearStatus();hideVerifyProgress();setButtonDefault();updateNextState()}
  function showStatus(t,m){statusMsg.className='status-msg visible '+t;statusText.textContent=m;if(t==='success'){statusIcon.innerHTML='<path d="M20 6L9 17l-5-5"/>';licenseIcon.className='license-icon success'}else{statusIcon.innerHTML='<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';licenseIcon.className='license-icon error'}}
  function clearStatus(){statusMsg.className='status-msg';statusText.textContent='';licenseIcon.className='license-icon'}
  function showVerifyProgress(){verifyProgress.classList.add('visible')}
  function hideVerifyProgress(){verifyProgress.classList.remove('visible')}
  function resetVerifyProgress(){for(var i=1;i<=3;i++){var s=getVStep(i);s.setAttribute('data-state','pending');s.querySelector('.verify-step-status').textContent='等待中';s.querySelector('.verify-step-dot svg').innerHTML='<path d="M20 6L9 17l-5-5"/>'}}
  function setVStepState(n,st,l){var s=getVStep(n),svg=s.querySelector('.verify-step-dot svg'),ss=s.querySelector('.verify-step-status');s.setAttribute('data-state',st);if(st==='running')ss.textContent=l||'检测中…';else if(st==='done'){ss.textContent=l||'成功';svg.innerHTML='<path d="M20 6L9 17l-5-5"/>'}else{ss.textContent=l||'失败';svg.innerHTML='<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'}}
  function setButtonVerifying(l){isVerifying=true;updateNextState();btnArrow.style.display='none';btnLabel.textContent=l||'正在验证…';if(!document.getElementById('btnSpinner')){var sp=document.createElement('span');sp.className='spinner';sp.id='btnSpinner';btnNext.insertBefore(sp,btnLabel)}}
  function setButtonRetry(){isVerifying=false;btnNext.disabled=false;btnNext.className='btn btn-retry';btnLabel.textContent='重新验证';btnArrow.innerHTML='<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>';btnArrow.style.display='';var sp=document.getElementById('btnSpinner');if(sp)sp.remove()}
  function setButtonDefault(){isVerifying=false;btnNext.className='btn btn-primary';btnLabel.textContent='验证并继续';btnArrow.innerHTML='<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';btnArrow.style.display='';var sp=document.getElementById('btnSpinner');if(sp)sp.remove();updateNextState()}
  function validateLicenseContent(k){k=(k||'').trim();if(!k)return{valid:false,msg:'授权文件内容为空'};if(k.length<20)return{valid:false,msg:'授权文件内容过短'};if(k.includes('EXPIRED'))return{valid:false,msg:'License 已过期'};if(k.includes('REVOKED'))return{valid:false,msg:'License 已被吊销'};if(k.startsWith('-----BEGIN LICENSE-----')||k.length>=64)return{valid:true,msg:'License 验证通过'};return{valid:false,msg:'授权文件格式不正确'}}
  function checkNetwork(){return new Promise(function(r){setTimeout(function(){var o=typeof navigator.onLine==='boolean'?navigator.onLine:true;r({success:o,errorMsg:o?'':'无法连接网络'})},800+Math.random()*600)})}
  function connectServer(){return new Promise(function(r){setTimeout(function(){r({success:true,errorMsg:''})},1000+Math.random()*800)})}
  function verifyLicenseFile(){return new Promise(function(r){setTimeout(function(){r(validateLicenseContent(fileContent))},600+Math.random()*400)})}
  function onVerifyFailed(){uploadZone.classList.remove('locked');setButtonRetry()}
  function onVerifySuccess(){showStatus('success','License 验证通过');uploadZone.classList.remove('locked');var sp=document.getElementById('btnSpinner');if(sp)sp.remove();btnNext.className='btn btn-primary';btnNext.disabled=true;btnLabel.textContent='验证成功';btnArrow.innerHTML='<path d="M20 6L9 17l-5-5"/>';btnArrow.style.display='';setTimeout(goToStep2,1000)}
  function runVerification(){if(isVerifying||!currentFile)return;clearStatus();resetVerifyProgress();showVerifyProgress();uploadZone.classList.add('locked');setVStepState(1,'running','检测中…');setButtonVerifying('正在检测网络…');checkNetwork().then(function(r){if(!r.success){setVStepState(1,'error','失败');showStatus('error',r.errorMsg);onVerifyFailed();return}setVStepState(1,'done','已连接');setVStepState(2,'running','连接中…');setButtonVerifying('正在连接服务器…');return connectServer().then(function(r2){if(!r2.success){setVStepState(2,'error','失败');showStatus('error',r2.errorMsg);onVerifyFailed();return}setVStepState(2,'done','已连接');setVStepState(3,'running','验证中…');setButtonVerifying('正在验证授权…');return verifyLicenseFile().then(function(r3){if(!r3.valid){setVStepState(3,'error','失败');showStatus('error',r3.msg);uploadZone.classList.add('has-error');uploadZone.classList.remove('has-file');onVerifyFailed();return}setVStepState(3,'done','验证通过');onVerifySuccess()})})}).catch(function(){for(var i=1;i<=3;i++)if(getVStep(i).getAttribute('data-state')==='running')setVStepState(i,'error','异常');showStatus('error','验证过程发生异常');onVerifyFailed()})}
  btnNext.addEventListener('click',function(){if(btnNext.classList.contains('btn-retry')){goToStep2();return}runVerification()});
  uploadZone.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}});
  var copyBtn=document.getElementById('copyAccountBtn'),copyToast=document.getElementById('copyToast'),toastTimer=null;
  copyBtn.addEventListener('click',function(){var val=document.getElementById('adminAccount').value;function done(){copyToast.classList.add('visible');copyBtn.classList.add('copied');copyBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){copyToast.classList.remove('visible');copyBtn.classList.remove('copied');copyBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'},1800)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(val).then(done)}else{var ta=document.createElement('textarea');ta.value=val;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}});
  document.getElementById('btnBack').addEventListener('click',function(){goToStep1()});
  var smsTimer=null,smsCountdown=0,smsBtn=document.getElementById('smsBtn');
  smsBtn.addEventListener('click',function(){var p=document.getElementById('adminPhone').value.trim();if(!/^1[3-9]\d{9}$/.test(p)){showFieldError('adminPhone','adminPhoneError','请先输入有效的手机号码');return}clearFieldError('adminPhone','adminPhoneError');startSmsCountdown()});
  function startSmsCountdown(){smsCountdown=60;smsBtn.disabled=true;smsBtn.textContent=smsCountdown+'s 后重发';smsTimer=setInterval(function(){smsCountdown--;if(smsCountdown<=0){clearInterval(smsTimer);smsBtn.disabled=false;smsBtn.textContent='发送验证码'}else smsBtn.textContent=smsCountdown+'s 后重发'},1000)}
  ['adminName','adminPhone','smsCode','schoolName'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('input',function(){clearFieldError(id,id+'Error')})});
  function showFieldError(iid,eid,m){var i=document.getElementById(iid);if(i)i.classList.add('error');var e=document.getElementById(eid);if(e){e.textContent=m;e.classList.add('visible')}}
  function clearFieldError(iid,eid){var i=document.getElementById(iid);if(i)i.classList.remove('error');var e=document.getElementById(eid);if(e)e.classList.remove('visible')}
  function validateStep2(){var v=true;var n=document.getElementById('adminName').value.trim();if(!n){showFieldError('adminName','adminNameError','请输入管理员姓名');v=false}else if(!/^[\u4e00-\u9fa5a-zA-Z\s·]+$/.test(n)){showFieldError('adminName','adminNameError','姓名仅支持中文和英文');v=false}else clearFieldError('adminName','adminNameError');var p=document.getElementById('adminPhone').value.trim();if(!p){showFieldError('adminPhone','adminPhoneError','请输入手机号码');v=false}else if(!/^1[3-9]\d{9}$/.test(p)){showFieldError('adminPhone','adminPhoneError','请输入有效的11位手机号码');v=false}else clearFieldError('adminPhone','adminPhoneError');var c=document.getElementById('smsCode').value.trim();if(!c){showFieldError('smsCode','smsCodeError','请输入验证码');v=false}else if(!/^\d{6}$/.test(c)){showFieldError('smsCode','smsCodeError','验证码为6位数字');v=false}else clearFieldError('smsCode','smsCodeError');var s=document.getElementById('schoolName').value.trim();if(!s){showFieldError('schoolName','schoolNameError','请输入学校名称');v=false}else if(s.length>20){showFieldError('schoolName','schoolNameError','学校名称不超过20个汉字');v=false}else clearFieldError('schoolName','schoolNameError');return v}
  document.getElementById('btnStep2').addEventListener('click',function(){if(!validateStep2())return;var self=this;self.disabled=true;self.innerHTML='<span class="spinner"></span>提交中…';setTimeout(function(){self.innerHTML='提交并继续<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';self.disabled=false;goToStep3()},800)});
  /* Step 3 Sync */
  var SYNC_DATA=[
    {id:1,files:[{name:'model_base_v3.2.onnx'},{name:'model_detect_v2.1.onnx'},{name:'model_classify_v1.8.onnx'}]},
    {id:2,files:[{name:'rules_detection.json'},{name:'rules_filter.json'},{name:'rules_alert.json',fail:true}]}
  ];
  var syncRunning=false,syncRetryMode=false;
  function setSyncTaskState(n,state,pct,fileName){
    var task=document.getElementById('syncTask'+n),icon=document.getElementById('syncIcon'+n),percent=document.getElementById('syncPercent'+n),fill=document.getElementById('syncFill'+n),file=document.getElementById('syncFile'+n);
    task.className='sync-task '+state;icon.className='sync-task-icon '+state;
    if(state==='done')icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    else if(state==='error')icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    else icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    percent.textContent=pct!=null?pct+'%':'0%';fill.style.width=(pct||0)+'%';fill.className='sync-progress-fill '+state;file.textContent=fileName||'等待同步…'}
  function resetSyncUI(){setSyncTaskState(1,'pending',0,'等待同步…');setSyncTaskState(2,'pending',0,'等待同步…');document.getElementById('syncError').style.display='none';document.getElementById('syncError').classList.remove('visible');document.getElementById('syncRetryRow').style.display='none';licenseIcon.className='license-icon'}
  function showSyncError(msg){document.getElementById('syncErrorText').textContent=msg||'同步失败，请检查网络后重试';document.getElementById('syncError').style.display='flex';document.getElementById('syncError').classList.add('visible');document.getElementById('syncRetryRow').style.display='block';licenseIcon.className='license-icon error'}
  function startSync(){if(syncRunning)return;syncRunning=true;resetSyncUI();var data=syncRetryMode?SYNC_DATA.map(function(d){return{id:d.id,files:d.files.map(function(f){return{name:f.name,fail:false}})}}):SYNC_DATA;syncRetryMode=false;runSyncTask(1,data[0],function(){runSyncTask(2,data[1],function(){syncRunning=false;setTimeout(goToStep4,800)},function(errMsg){syncRunning=false;showSyncError(errMsg)})},function(errMsg){syncRunning=false;showSyncError(errMsg)})}
  function runSyncTask(taskNum,taskData,onDone,onFail){
    var files=taskData.files,currentFileIdx=0,basePct=0;
    setSyncTaskState(taskNum,'running',0,'准备同步…');
    function processNextFile(){
      if(currentFileIdx>=files.length){setSyncTaskState(taskNum,'done',100,'同步完成');onDone();return}
      var f=files[currentFileIdx];setSyncTaskState(taskNum,'running',basePct,f.name);
      var targetPct=Math.round(((currentFileIdx+1)/files.length)*100);
      var steps=5+Math.floor(Math.random()*4),stepPct=(targetPct-basePct)/steps,step=0;
      var interval=setInterval(function(){
        step++;var pct=Math.min(basePct+Math.round(stepPct*step),targetPct-1);
        if(f.fail&&step>=steps-1){clearInterval(interval);setSyncTaskState(taskNum,'error',pct,f.name+' — 同步失败');onFail('同步 '+f.name+' 时出错，请检查网络连接后重试');return}
        setSyncTaskState(taskNum,'running',pct,f.name);
        if(step>=steps){clearInterval(interval);basePct=targetPct;setSyncTaskState(taskNum,'running',basePct,f.name);currentFileIdx++;setTimeout(processNextFile,300+Math.random()*400)}
      },300+Math.random()*200)}
    setTimeout(processNextFile,500)}

  document.getElementById('btnSyncRetry').addEventListener('click',function(){syncRetryMode=true;startSync()});

  /* Step 4 */
  document.getElementById('btnEnter').addEventListener('click',function(){window.location.href='login.html'});
})();
</script>
